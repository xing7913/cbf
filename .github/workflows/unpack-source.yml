name: Expand ROS 2 source bundle
on:
  push:
    paths:
      - ".upload-parts/READY"
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reassemble and validate source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f .upload-parts/READY
          cat .upload-parts/part-*.b64 | base64 --decode > /tmp/safe-obstacle-avoidance-ros2.tar.gz
          test "$(stat -c %s /tmp/safe-obstacle-avoidance-ros2.tar.gz)" -gt 10000
          gzip -t /tmp/safe-obstacle-avoidance-ros2.tar.gz
          tar -tzf /tmp/safe-obstacle-avoidance-ros2.tar.gz
      - name: Expand project into repository root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/project
          tar -xzf /tmp/safe-obstacle-avoidance-ros2.tar.gz -C /tmp/project
          test -d /tmp/project/safe-obstacle-avoidance-ros2
          cp -a /tmp/project/safe-obstacle-avoidance-ros2/. .
          rm -rf .upload-parts
          # The Actions token has contents:write but not workflows:write.
          # Exclude the additional static-check workflow from this push.
          rm -f .github/workflows/static-checks.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit expanded files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add native ROS 2 safe obstacle avoidance project"
          git push
