name: Expand ROS 2 source bundle
on:
  push:
    paths:
      - safe-obstacle-avoidance-ros2.tar.gz
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand source tree into repository root
        run: |
          mkdir -p .bundle-tmp
          tar -xzf safe-obstacle-avoidance-ros2.tar.gz -C .bundle-tmp
          cp -a .bundle-tmp/safe-obstacle-avoidance-ros2/. .
          rm -rf .bundle-tmp safe-obstacle-avoidance-ros2.tar.gz
      - name: Commit expanded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add native ROS 2 source tree"
          git push
